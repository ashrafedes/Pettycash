<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… | PettyCash</title>
<script>
(function() {
  var path = window.location.pathname;
  var m = path.match(/^\/(en|ar)\/articles\/(.+)$/);
  if (m) {
    // Article URL detected — dynamically load article.html content
    var lang = m[1];
    var slug = m[2];
    // Fetch the article.html and inject it
    fetch('/' + lang + '/article.html')
      .then(function(r) { return r.text(); })
      .then(function(html) {
        // Replace the entire page with article.html content
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function() {
        document.title = 'Article Not Found | PettyCash';
        document.body.innerHTML = '<p style="text-align:center;padding:40px">Article not found. <a href="/' + lang + '/blog.html">Back to blog</a></p>';
      });
  } else {
    // Not an article URL — show normal 404
    document.title = '404 | PettyCash';
  }
})();
</script>
</head>
<body style="font-family:Inter,sans-serif;text-align:center;padding:60px 20px">
<p id="loading" style="color:#64748b">Loading…</p>
</body>
</html>
