[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[build.processing.html]
  minify = true

[build.processing.css]
  minify = true

[build.processing.js]
  minify = true

# Redirect root to /en/ (default language)
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false

# Redirect old root HTML pages to /en/ versions
[[redirects]]
  from = "/index.html"
  to = "/en/"
  status = 302
  force = true

[[redirects]]
  from = "/features.html"
  to = "/en/features.html"
  status = 302
  force = true

[[redirects]]
  from = "/pricing.html"
  to = "/en/pricing.html"
  status = 302
  force = true

[[redirects]]
  from = "/about.html"
  to = "/en/about.html"
  status = 302
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/en/contact.html"
  status = 302
  force = true

[[redirects]]
  from = "/blog.html"
  to = "/en/blog.html"
  status = 302
  force = true

[[redirects]]
  from = "/help.html"
  to = "/en/help.html"
  status = 302
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/en/privacy.html"
  status = 302
  force = true

[[redirects]]
  from = "/security.html"
  to = "/en/security.html"
  status = 302
  force = true

[[redirects]]
  from = "/compliance.html"
  to = "/en/compliance.html"
  status = 302
  force = true

# Redirect article.html to root (dynamic page with JS translations)
[[redirects]]
  from = "/en/article.html"
  to = "/article.html"
  status = 200
  force = true

[[redirects]]
  from = "/ar/article.html"
  to = "/article.html"
  status = 200
  force = true

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long cache for static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
