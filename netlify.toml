[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[build.processing.html]
  minify = true

[build.processing.css]
  minify = true

[build.processing.js]
  minify = true

# Redirect root to /en/ (default language)
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = false

# article.html - SEO-friendly URLs: /en/articles/:slug and /ar/articles/:slug
# 301 redirect old URLs to new clean URLs
[[redirects]]
  from = "/article.html"
  query = {slug = ":slug"}
  to = "/en/articles/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/en/article.html"
  query = {slug = ":slug"}
  to = "/en/articles/:slug"
  status = 301
  force = true

[[redirects]]
  from = "/ar/article.html"
  query = {slug = ":slug"}
  to = "/ar/articles/:slug"
  status = 301
  force = true

# Rewrite clean article URLs to serve article.html
[[redirects]]
  from = "/en/articles/*"
  to = "/en/article.html"
  status = 200
  force = true

[[redirects]]
  from = "/ar/articles/*"
  to = "/ar/article.html"
  status = 200
  force = true

# Redirect bare article.html (no slug) to blog
[[redirects]]
  from = "/article.html"
  to = "/en/blog.html"
  status = 302
  force = true

